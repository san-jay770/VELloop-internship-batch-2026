<svg width="180" height="120" viewBox="0 0 180 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldRimGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#845308" />
      <stop offset="15%" stop-color="#fcd34d" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <linearGradient id="goldWireGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="goldBaseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="25%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#fffbeb" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <radialGradient id="basketGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Golden Glow behind basket -->
  <ellipse cx="90" cy="55" rx="75" ry="45" fill="url(#basketGlow)" />

  <!-- Wire Net Behind Base -->
  <!-- Left-to-Right diagonal wires -->
  <path d="M 22 18 Q 40 60 70 85" stroke="url(#goldWireGradient)" stroke-width="1.8" filter="url(#goldGlow)" />
  <path d="M 38 18 Q 52 60 76 85" stroke="url(#goldWireGradient)" stroke-width="1.8" filter="url(#goldGlow)" />
  <path d="M 56 18 Q 66 60 82 85" stroke="url(#goldWireGradient)" stroke-width="1.8" />
  <path d="M 74 18 Q 80 60 88 85" stroke="url(#goldWireGradient)" stroke-width="1.8" />
  <path d="M 92 18 Q 94 60 94 85" stroke="url(#goldWireGradient)" stroke-width="1.8" />
  <path d="M 110 18 Q 106 60 100 85" stroke="url(#goldWireGradient)" stroke-width="1.8" />
  <path d="M 126 18 Q 118 60 106 85" stroke="url(#goldWireGradient)" stroke-width="1.8" filter="url(#goldGlow)" />
  <path d="M 142 18 Q 128 60 112 85" stroke="url(#goldWireGradient)" stroke-width="1.8" filter="url(#goldGlow)" />
  <path d="M 158 18 Q 138 60 116 85" stroke="url(#goldWireGradient)" stroke-width="1.8" filter="url(#goldGlow)" />

  <!-- Right-to-Left diagonal crossing wires (creating diamond lattice) -->
  <path d="M 158 18 Q 140 60 110 85" stroke="url(#goldWireGradient)" stroke-width="1.8" filter="url(#goldGlow)" />
  <path d="M 142 18 Q 128 60 104 85" stroke="url(#goldWireGradient)" stroke-width="1.8" filter="url(#goldGlow)" />
  <path d="M 124 18 Q 114 60 98 85" stroke="url(#goldWireGradient)" stroke-width="1.8" />
  <path d="M 106 18 Q 100 60 92 85" stroke="url(#goldWireGradient)" stroke-width="1.8" />
  <path d="M 88 18 Q 86 60 86 85" stroke="url(#goldWireGradient)" stroke-width="1.8" />
  <path d="M 70 18 Q 74 60 80 85" stroke="url(#goldWireGradient)" stroke-width="1.8" />
  <path d="M 54 18 Q 62 60 74 85" stroke="url(#goldWireGradient)" stroke-width="1.8" filter="url(#goldGlow)" />
  <path d="M 38 18 Q 52 60 68 85" stroke="url(#goldWireGradient)" stroke-width="1.8" filter="url(#goldGlow)" />
  <path d="M 22 18 Q 42 60 64 85" stroke="url(#goldWireGradient)" stroke-width="1.8" filter="url(#goldGlow)" />

  <!-- Bottom Solid Gold Ring / Base Pedestal -->
  <!-- Base shadow -->
  <ellipse cx="90" cy="94" rx="30" ry="8" fill="#120c04" opacity="0.6" />
  <!-- Base cylinder wall -->
  <path d="M 60 86 C 60 86 60 94 60 94 C 60 98 73 101 90 101 C 107 101 120 98 120 94 C 120 94 120 86 120 86 Z" fill="url(#goldBaseGradient)" />
  <!-- Base bottom edge ring -->
  <ellipse cx="90" cy="94" rx="30" ry="7" fill="url(#goldBaseGradient)" stroke="#fff" stroke-opacity="0.3" stroke-width="1" />
  <!-- Base top rim ring -->
  <ellipse cx="90" cy="86" rx="28" ry="6" fill="#2b1a05" stroke="url(#goldRimGradient)" stroke-width="2.5" />

  <!-- Top Large Metallic Gold Hoop Rim -->
  <!-- Outer Rim Ring with thick metallic glow -->
  <ellipse cx="90" cy="18" rx="72" ry="12" fill="none" stroke="url(#goldRimGradient)" stroke-width="5" filter="url(#goldGlow)" />
  <!-- Inner Highlight Specular Ring -->
  <ellipse cx="90" cy="18" rx="70" ry="11" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.75" />
  <ellipse cx="90" cy="19.5" rx="71" ry="11" fill="none" stroke="#78350f" stroke-width="1.5" stroke-opacity="0.6" />
</svg>

