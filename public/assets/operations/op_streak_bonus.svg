<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bgGrad6" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1F293D" />
      <stop offset="70%" stop-color="#121824" />
      <stop offset="100%" stop-color="#090D14" />
    </radialGradient>
    <linearGradient id="goldRim6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="25%" stop-color="#E5C98D" />
      <stop offset="60%" stop-color="#B88A36" />
      <stop offset="90%" stop-color="#F2D79E" />
      <stop offset="100%" stop-color="#805915" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B91C1C" />
      <stop offset="35%" stop-color="#EA580C" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <linearGradient id="innerFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="60%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <circle cx="128" cy="128" r="120" fill="none" stroke="#C5A66A" stroke-width="2" stroke-opacity="0.4" />
  <circle cx="128" cy="128" r="115" fill="none" stroke="url(#goldRim6)" stroke-width="6" filter="url(#shadow6)" />
  <circle cx="128" cy="128" r="109" fill="none" stroke="#FCE1A9" stroke-width="1.5" stroke-opacity="0.7" />
  <circle cx="128" cy="128" r="106" fill="url(#bgGrad6)" />
  <circle cx="128" cy="128" r="82" fill="none" stroke="#C5A66A" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.35" />

  <!-- Phoenix Streak Flame -->
  <g filter="url(#flameGlow)">
    <!-- Outer Flame -->
    <path d="M128,70 C145,95 174,122 174,148 C174,172 154,188 128,188 C102,188 82,172 82,148 C82,126 104,102 118,88 C116,108 126,118 132,112 C138,104 134,88 128,70 Z" fill="url(#flameGrad)" filter="url(#shadow6)" stroke="#FFF8E0" stroke-width="1.5" />
    <!-- Inner Radiant Flame Core -->
    <path d="M128,115 C138,130 152,145 152,160 C152,174 142,182 128,182 C114,182 104,174 104,160 C104,148 116,134 124,124 C122,136 128,140 130,136 C132,132 130,124 128,115 Z" fill="url(#innerFlame)" />
  </g>

  <!-- Sparkles -->
  <polygon points="174,86 177,92 184,94 177,96 174,102 171,96 164,94 171,92" fill="#FDE047" opacity="0.9" />
</svg>