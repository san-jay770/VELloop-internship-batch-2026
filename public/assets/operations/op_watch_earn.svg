<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bgGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1F293D" />
      <stop offset="70%" stop-color="#121824" />
      <stop offset="100%" stop-color="#090D14" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="25%" stop-color="#E5C98D" />
      <stop offset="60%" stop-color="#B88A36" />
      <stop offset="90%" stop-color="#F2D79E" />
      <stop offset="100%" stop-color="#805915" />
    </linearGradient>
    <linearGradient id="playGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FCE1A9" />
      <stop offset="70%" stop-color="#DAA520" />
      <stop offset="100%" stop-color="#916B16" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Outer Ambient Glow Ring -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="#C5A66A" stroke-width="2" stroke-opacity="0.4" />

  <!-- Outer Gold Bezel -->
  <circle cx="128" cy="128" r="115" fill="none" stroke="url(#goldRim)" stroke-width="6" filter="url(#shadow)" />
  <circle cx="128" cy="128" r="109" fill="none" stroke="#FCE1A9" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- Obsidian Disc Core -->
  <circle cx="128" cy="128" r="106" fill="url(#bgGrad)" />

  <!-- Inner Subtle Ring -->
  <circle cx="128" cy="128" r="82" fill="none" stroke="#C5A66A" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.35" />

  <!-- Golden 3D Play Symbol with Glow -->
  <g filter="url(#goldGlow)">
    <polygon points="106,86 172,128 106,170" fill="url(#playGold)" filter="url(#shadow)" stroke="#FFF5DC" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- Sparkles -->
  <polygon points="174,80 177,88 185,91 177,94 174,102 171,94 163,91 171,88" fill="#FFF2D6" opacity="0.9" />
  <polygon points="84,166 86,172 92,174 86,176 84,182 82,176 76,174 82,172" fill="#E5C98D" opacity="0.8" />
</svg>