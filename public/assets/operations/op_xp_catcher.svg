<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bgGrad4" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1F293D" />
      <stop offset="70%" stop-color="#121824" />
      <stop offset="100%" stop-color="#090D14" />
    </radialGradient>
    <linearGradient id="goldRim4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="25%" stop-color="#E5C98D" />
      <stop offset="60%" stop-color="#B88A36" />
      <stop offset="90%" stop-color="#F2D79E" />
      <stop offset="100%" stop-color="#805915" />
    </linearGradient>
    <radialGradient id="orbGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#67E8F9" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0E7490" />
    </radialGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <circle cx="128" cy="128" r="120" fill="none" stroke="#C5A66A" stroke-width="2" stroke-opacity="0.4" />
  <circle cx="128" cy="128" r="115" fill="none" stroke="url(#goldRim4)" stroke-width="6" filter="url(#shadow4)" />
  <circle cx="128" cy="128" r="109" fill="none" stroke="#FCE1A9" stroke-width="1.5" stroke-opacity="0.7" />
  <circle cx="128" cy="128" r="106" fill="url(#bgGrad4)" />
  <circle cx="128" cy="128" r="82" fill="none" stroke="#C5A66A" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.35" />

  <!-- Magnetic Rings Around Orb -->
  <ellipse cx="128" cy="128" rx="58" ry="24" fill="none" stroke="#E5C98D" stroke-width="2" transform="rotate(-25 128 128)" opacity="0.75" />
  <ellipse cx="128" cy="128" rx="58" ry="24" fill="none" stroke="#67E8F9" stroke-width="1.5" transform="rotate(35 128 128)" opacity="0.65" />

  <!-- Glowing XP Crystal Orb -->
  <g filter="url(#cyanGlow)">
    <circle cx="128" cy="128" r="38" fill="url(#orbGrad)" filter="url(#shadow4)" />
    <!-- Crystalline Facet Highlights -->
    <polygon points="128,94 146,112 128,124 110,112" fill="#FFFFFF" opacity="0.6" />
    <polygon points="128,124 146,112 152,136 128,158" fill="#CFFAFE" opacity="0.4" />
    <polygon points="128,124 110,112 104,136 128,158" fill="#0891B2" opacity="0.5" />
    <!-- 2X Indicator Text in Gold -->
    <text x="128" y="134" font-family="'Orbitron', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" filter="url(#shadow4)">2X</text>
  </g>

  <!-- Sparkles -->
  <polygon points="170,82 173,88 180,90 173,92 170,98 167,92 160,90 167,88" fill="#67E8F9" opacity="0.9" />
</svg>