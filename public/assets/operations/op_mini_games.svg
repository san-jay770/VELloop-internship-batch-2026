<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bgGrad5" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1F293D" />
      <stop offset="70%" stop-color="#121824" />
      <stop offset="100%" stop-color="#090D14" />
    </radialGradient>
    <linearGradient id="goldRim5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="25%" stop-color="#E5C98D" />
      <stop offset="60%" stop-color="#B88A36" />
      <stop offset="90%" stop-color="#F2D79E" />
      <stop offset="100%" stop-color="#805915" />
    </linearGradient>
    <linearGradient id="padGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9EA" />
      <stop offset="35%" stop-color="#FCE1A9" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8A6715" />
    </linearGradient>
    <filter id="goldGlow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <circle cx="128" cy="128" r="120" fill="none" stroke="#C5A66A" stroke-width="2" stroke-opacity="0.4" />
  <circle cx="128" cy="128" r="115" fill="none" stroke="url(#goldRim5)" stroke-width="6" filter="url(#shadow5)" />
  <circle cx="128" cy="128" r="109" fill="none" stroke="#FCE1A9" stroke-width="1.5" stroke-opacity="0.7" />
  <circle cx="128" cy="128" r="106" fill="url(#bgGrad5)" />
  <circle cx="128" cy="128" r="82" fill="none" stroke="#C5A66A" stroke-width="1.5" stroke-dasharray="6,4" stroke-opacity="0.35" />

  <!-- Royal Gamepad Controller -->
  <g filter="url(#goldGlow5)">
    <!-- Controller Body -->
    <path d="M82,106 C70,106 60,118 64,146 C68,170 86,174 98,162 L112,148 L144,148 L158,162 C170,174 188,170 192,146 C196,118 186,106 174,106 Z" fill="url(#padGold)" filter="url(#shadow5)" stroke="#FFF8E0" stroke-width="2" />
    <!-- D-Pad Left -->
    <path d="M90,126 L96,126 L96,120 L102,120 L102,126 L108,126 L108,132 L102,132 L102,138 L96,138 L96,132 L90,132 Z" fill="#151C28" />
    <!-- Buttons Right -->
    <circle cx="160" cy="123" r="3.5" fill="#10B981" />
    <circle cx="168" cy="129" r="3.5" fill="#EF4444" />
    <circle cx="152" cy="129" r="3.5" fill="#3B82F6" />
    <circle cx="160" cy="135" r="3.5" fill="#F59E0B" />
  </g>

  <!-- Sparkles -->
  <polygon points="128,78 130,83 135,85 130,87 128,92 126,87 121,85 126,83" fill="#FFF2D6" opacity="0.9" />
</svg>